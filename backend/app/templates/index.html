        contact_msg: "বার্তা",
        contact_send: "বার্তা পাঠান",
        contact_success: "ধন্যবাদ! আমাদের সহায়তা দল শীঘ্রই আপনার সাথে যোগাযোগ করবে।"
      }
    };

    // --- API HELPER OBJECT ---
    const API = {
      baseUrl: window.location.origin.startsWith('file') ? 'http://localhost:8000' : window.location.origin,
      
      async getDashboard(userId) {
        return axios.get(`${this.baseUrl}/api/dashboard/${userId}`);
      },
      async getTasks(userId) {
        return axios.get(`${this.baseUrl}/api/tasks/${userId}`);
      },
      async createTask(userId, taskName, dueDate) {
        return axios.post(`${this.baseUrl}/api/tasks/${userId}`, { task_name: taskName, due_date: dueDate });
      },
      async updateTask(taskId, completedStatus) {
        return axios.put(`${this.baseUrl}/api/tasks/${taskId}`, { completed_status: completedStatus });
      },
      async deleteTask(taskId) {
        return axios.delete(`${this.baseUrl}/api/tasks/${taskId}`);
      },
      async getWeather(city) {
        return axios.get(`${this.baseUrl}/api/weather/${city}`);
      },
      async getMarketplace(search = '', category = '') {
        return axios.get(`${this.baseUrl}/api/marketplace`, { params: { search, category } });
      },
      async createProduct(productData) {
        return axios.post(`${this.baseUrl}/api/marketplace`, productData);
      },
      async uploadLeaf(file) {
        const fd = new FormData();
        fd.append('file', file);
        return axios.post(`${this.baseUrl}/api/scanner/upload`, fd, {
          headers: { 'Content-Type': 'multipart/form-data' }
        });
      },
      async globalSearch(query) {
        return axios.get(`${this.baseUrl}/api/search`, { params: { query } });
      },
      async login(email, password) {
        return axios.post(`${this.baseUrl}/api/auth/login`, { email, password });
      },
      async register(name, email, location, language, password) {
        return axios.post(`${this.baseUrl}/api/auth/register`, {
          farmer_name: name, email, location, language, password
        });
      }
    };

    // --- SHARED UI SUB-COMPONENTS ---

    function ProductCard({ product, t }) {
      return (
        <div className="flex flex-col bg-white border border-primary/10 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 hover:-translate-y-1">

    // --- MAIN COMPONENT ---
    function App() {
      const [lang, setLang] = useState(localStorage.getItem('agriverse-lang') || 'en');
      const [theme, setTheme] = useState(localStorage.getItem('agriverse-theme') || 'organic');
      const [currentPage, setCurrentPage] = useState('home');
      const [currentUser, setCurrentUser] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [globalSearchVal, setGlobalSearchVal] = useState('');
      const [globalMicListening, setGlobalMicListening] = useState(false);

      // Chatbot states
      const [chatOpen, setChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        { id: 1, text: translations[lang].chat_welcome, sender: 'bot' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatTyping, setChatTyping] = useState(false);

      // Translation helper
      const t = (key) => translations[lang]?.[key] || translations['en']?.[key] || key;

      // Persist Theme and Lang
      useEffect(() => {
        localStorage.setItem('agriverse-theme', theme);
        if (theme === 'tech') {
          document.body.classList.add('theme-tech');
        } else {
          document.body.classList.remove('theme-tech');
        }
      }, [theme]);

      useEffect(() => {
        localStorage.setItem('agriverse-lang', lang);
      }, [lang]);

      useEffect(() => {
        const saved = localStorage.getItem('agriverse-user');
        if (saved) setCurrentUser(JSON.parse(saved));
      }, []);

      // Trigger Lucide icons rendering
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentPage, sidebarOpen, chatOpen, chatTyping]);

      const handleLoginSuccess = (user) => {
        setCurrentUser(user);
        localStorage.setItem('agriverse-user', JSON.stringify(user));
        setCurrentPage('dashboard');
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('agriverse-user');
        setCurrentPage('home');
      };

      const handleChatSubmit = (e) => {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const userMsg = { id: Date.now(), text: chatInput, sender: 'user' };
        setChatMessages(prev => [...prev, userMsg]);
        const query = chatInput.toLowerCase();
        setChatInput('');
        setChatTyping(true);

        setTimeout(() => {
          let reply = "";
          if (query.includes('weather') || query.includes('rain')) {
            reply = "Weather report predicts clear skies for Bangalore and rain forecasts for Mumbai. Access the Weather tab to consult maps.";
          } else if (query.includes('blight') || query.includes('leaf') || query.includes('disease')) {
            reply = "Identify spots or discoloration instantly by uploading to the Leaf Scanner tab. Presets are available for testing!";
          } else if (query.includes('price') || query.includes('market') || query.includes('sell')) {
            reply = "Direct listing and transactions are open in the Marketplace. Organic NPK rates sit near ₹800.";
          } else {
            reply = `That is an interesting question. Please explore our Learning Center guides or search for "${query}" inside our global search tool.`;
          }

          setChatMessages(prev => [...prev, { id: Date.now() + 1, text: reply, sender: 'bot' }]);
          setChatTyping(false);
        }, 1000);
      };

      const handleGlobalMic = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Speech recognition not supported in this browser.");
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        recognition.onstart = () => setGlobalMicListening(true);
        recognition.onresult = (e) => {
          const txt = e.results[0][0].transcript;
          setGlobalSearchVal(txt);
          setCurrentPage('search');
        };
        recognition.onend = () => setGlobalMicListening(false);
        recognition.start();
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* NAVBAR */}
          <nav className="sticky top-0 z-50 flex items-center justify-between px-6 py-4 bg-white/80 backdrop-blur-md border-b border-primary/10 shadow-sm">
            <div className="flex items-center gap-3">
              <button 
                onClick={() => setSidebarOpen(prev => !prev)}
                className="p-2 mr-1 rounded-lg hover:bg-primary/5 lg:hidden text-primary"
              >
                <i data-lucide="menu" className="w-6 h-6"></i>
              </button>
              <div onClick={() => setCurrentPage('home')} className="flex items-center gap-2 cursor-pointer">
                {/* Custom Logo Image Uploaded by User */}
                <img src="/static/logo.png" alt="AgriVerse Logo" className="w-10 h-10 object-contain rounded-xl shadow-sm" onError={(e) => { e.target.style.display = 'none'; }} />
                <div>
                  <span className="text-xl font-bold tracking-tight text-primary block leading-none">{t('app_name')}</span>
                  <span className="text-xs text-primary-light font-medium">{t('tagline')}</span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="relative flex items-center gap-1 text-primary">
                <i data-lucide="globe" className="w-4 h-4 opacity-70"></i>
                <select 
                  value={lang} 
                  onChange={(e) => setLang(e.target.value)}
                  className="bg-transparent font-medium border-none focus:ring-0 cursor-pointer text-sm pr-4"
                >
                  <option value="en">English</option>
                  <option value="hi">हिन्दी</option>
                  <option value="te">తెలుగు</option>
                  <option value="ta">தமிழ் (Tamil)</option>
                  <option value="kn">ಕನ್ನಡ (Kannada)</option>
                  <option value="mr">मराठी (Marathi)</option>
                  <option value="bn">বাংলা (Bengali)</option>
                </select>
              </div>

              {/* Global Mic Search Button */}
              <button 
                onClick={handleGlobalMic}
                className={`p-2.5 rounded-xl hover:scale-105 transition-transform ${globalMicListening ? 'bg-red-500 text-white animate-pulse' : 'hover:bg-primary/5 text-primary'}`}
                title="Global Voice Command"
              >
                <i data-lucide="mic" className="w-5 h-5"></i>
              </button>

              <button 
                onClick={() => setTheme(prev => prev === 'organic' ? 'tech' : 'organic')}
                className="p-2.5 rounded-xl hover:bg-primary/5 text-primary"
              >
                <i data-lucide={theme === 'organic' ? "moon" : "sun"} className="w-5 h-5"></i>
              </button>

              {currentUser ? (
                <div className="flex items-center gap-3 border-l border-primary/15 pl-4">
                  <div className="hidden sm:block text-right">
                    <span className="text-xs text-primary-light block font-semibold">Farmer</span>
                    <span className="text-sm font-bold text-primary">{currentUser.farmer_name}</span>
                  </div>
                  <button 
                    onClick={handleLogout}
                    className="p-2.5 rounded-xl text-accent-dark hover:bg-accent-dark/5"
                    title={t('btn_logout')}
                  >
                    <i data-lucide="log-out" className="w-5 h-5"></i>
                  </button>
                </div>
              ) : (
                <button 
                  onClick={() => setCurrentPage('login')}
                  className="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-primary hover:bg-primary-light rounded-xl shadow-md"
                >
                  <i data-lucide="user" className="w-4 h-4"></i>
                  <span>{t('btn_login')}</span>
                </button>
              )}
            </div>
          </nav>

          <div className="flex-1 flex relative">
            {/* SIDEBAR */}
            {sidebarOpen && (
              <div onClick={() => setSidebarOpen(false)} className="fixed inset-0 z-40 bg-black/40 lg:hidden backdrop-blur-sm" />
            )}

            <aside className={`fixed top-0 bottom-0 left-0 z-40 flex flex-col w-64 bg-white border-r border-primary/10 transition-transform duration-300 lg:translate-x-0 lg:sticky lg:top-[73px] lg:h-[calc(100vh-73px)] ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
              <div className="flex items-center justify-between p-4 border-b border-primary/10 lg:hidden">
                <div className="flex items-center gap-2">
                  <img src="/static/logo.png" alt="AgriVerse Logo" className="w-7 h-7 object-contain rounded" onError={(e) => { e.target.style.display = 'none'; }} />
                  <span className="font-bold text-primary">{t('app_name')}</span>
                </div>
                <button onClick={() => setSidebarOpen(false)} className="p-1 rounded-lg hover:bg-primary/5 text-primary">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
              </div>
              <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
                {[
                  { id: 'home', name: t('nav_home'), icon: 'home' },
                  { id: 'dashboard', name: t('nav_dashboard'), icon: 'layout-dashboard' },
                  { id: 'search', name: t('nav_search'), icon: 'search' },
                  { id: 'weather', name: t('nav_weather'), icon: 'cloud' },
                  { id: 'scanner', name: t('nav_scanner'), icon: 'leaf' },
                  { id: 'marketplace', name: t('nav_marketplace'), icon: 'shopping-bag' },
                  { id: 'learning', name: t('nav_learning'), icon: 'book-open' },
                  { id: 'contact', name: t('nav_contact'), icon: 'phone' }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => { setCurrentPage(item.id); setSidebarOpen(false); }}
                    className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-sm font-semibold transition-theme ${currentPage === item.id ? 'bg-primary text-white shadow-md' : 'text-primary/75 hover:bg-primary/5 hover:text-primary'}`}
                  >
                    <i data-lucide={item.icon} className="w-5 h-5"></i>
                    <span>{item.name}</span>
                  </button>
                ))}
              </nav>
              <div className="p-4 border-t border-primary/10 text-center">
                <p className="text-[11px] font-semibold text-primary-light">AgriVerse Ecosystem v1.0</p>
                <p className="text-[10px] text-primary/40 mt-0.5">&copy; 2026 Smart Farming Ecosystem</p>
              </div>
            </aside>

            {/* MAIN CONTENT PANELS */}
            <main className="flex-1 flex flex-col min-w-0 p-4 sm:p-6">
              {currentPage === 'home' && <HomePanel t={t} setCurrentPage={setCurrentPage} />}
              {currentPage === 'dashboard' && <DashboardPanel t={t} currentUser={currentUser} setCurrentPage={setCurrentPage} />}
              {currentPage === 'search' && <SearchPanel t={t} initialQuery={globalSearchVal} />}
              {currentPage === 'weather' && <WeatherPanel t={t} currentUser={currentUser} />}
              {currentPage === 'scanner' && <ScannerPanel t={t} />}
              {currentPage === 'marketplace' && <MarketplacePanel t={t} currentUser={currentUser} />}
              {currentPage === 'learning' && <LearningPanel t={t} />}
              {currentPage === 'contact' && <ContactPanel t={t} />}
              {currentPage === 'login' && <LoginPanel t={t} onLoginSuccess={handleLoginSuccess} />}

              {/* FOOTER */}
              <footer className="py-8 px-6 bg-primary/5 rounded-3xl border border-primary/10 transition-theme mt-12 text-primary">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-sm">
                  <div>
                    <h3 className="font-bold text-base">{t('app_name')}</h3>
                    <p className="text-xs text-primary/75 mt-2 max-w-sm">{t('hero_subtitle')}</p>
                  </div>
                  <div>
                    <h4 className="font-semibold text-xs uppercase tracking-wider text-primary-light">Support Services</h4>
                    <ul className="mt-3 space-y-2 text-xs text-primary/80">
                      <li><a href="#learning" onClick={() => setCurrentPage('learning')} className="hover:underline">Organic Farming Tips</a></li>
                      <li><a href="#weather" onClick={() => setCurrentPage('weather')} className="hover:underline">Weather Forecast Station</a></li>
                      <li><a href="#scanner" onClick={() => setCurrentPage('scanner')} className="hover:underline">Plant Diseases Database</a></li>
                    </ul>
                  </div>
                  <div>
                    <h4 className="font-semibold text-xs uppercase tracking-wider text-primary-light">Government Support</h4>
                    <ul className="mt-3 space-y-2 text-xs text-primary/80 font-medium">
                      <li><a href="#subsidy" className="hover:underline">PM-KISAN Scheme Alerts</a></li>
                      <li><a href="#sub" className="hover:underline">Soil Health Card Subsidies</a></li>
                    </ul>
                  </div>
                </div>
              </footer>
            </main>
          </div>

          {/* CHATBOT */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end">
            {chatOpen && (
              <div className="flex flex-col w-[350px] sm:w-[380px] h-[450px] bg-white border border-primary/20 rounded-2xl shadow-2xl overflow-hidden mb-4 transition-theme">
                <div className="flex items-center justify-between p-4 bg-primary text-white">
                  <div className="flex items-center gap-2">
                    <i data-lucide="bot" className="w-5 h-5 text-accent"></i>
                    <div>
                      <h3 className="font-bold text-sm leading-none">{t('chat_header')}</h3>
                      <span className="text-[10px] text-accent/80 font-medium">Online Helper</span>
                    </div>
                  </div>
                  <button onClick={() => setChatOpen(false)} className="p-1 rounded-lg hover:bg-white/10">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>
                <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-primary/5">
                  {chatMessages.map(msg => (
                    <div key={msg.id} className={`flex gap-2 max-w-[80%] ${msg.sender === 'user' ? 'ml-auto flex-row-reverse' : ''}`}>
                      <div className={`flex items-center justify-center w-8 h-8 rounded-full text-white shrink-0 ${msg.sender === 'user' ? 'bg-primary-light' : 'bg-primary'}`}>
                        <i data-lucide={msg.sender === 'user' ? "user" : "bot"} className="w-4 h-4"></i>
                      </div>
                      <div className={`p-3 rounded-2xl text-xs shadow-sm ${msg.sender === 'user' ? 'bg-primary text-white rounded-tr-none' : 'bg-white border border-primary/10 rounded-tl-none text-primary'}`}>
                        <p>{msg.text}</p>
                      </div>
                    </div>
                  ))}
                  {chatTyping && (
                    <div className="flex gap-2 max-w-[80%]">
                      <div className="flex items-center justify-center w-8 h-8 rounded-full bg-primary text-white shrink-0">
                        <i data-lucide="bot" className="w-4 h-4"></i>
                      </div>
                      <div className="p-3 bg-white border border-primary/10 rounded-2xl rounded-tl-none text-xs flex gap-1">
                        <span className="w-1 h-1 bg-primary rounded-full animate-bounce"></span>
                        <span className="w-1 h-1 bg-primary rounded-full animate-bounce" style={{animationDelay:'150ms'}}></span>
                      </div>
                    </div>
                  )}
                </div>
                <form onSubmit={handleChatSubmit} className="p-3 bg-white border-t border-primary/10 flex gap-2">
                  <input 
                    type="text" 
                    value={chatInput} 
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder={t('chat_placeholder')}
                    className="flex-1 px-4 py-2 text-xs bg-background border border-primary/10 rounded-xl focus:outline-none"
                  />
                  <button type="submit" className="p-2 bg-primary text-white rounded-xl hover:bg-primary-light">
                    <i data-lucide="send" className="w-4 h-4"></i>
                  </button>
                </form>
              </div>
            )}
            <button 
              onClick={() => setChatOpen(!chatOpen)}
              className="flex items-center justify-center w-14 h-14 rounded-full bg-primary text-white shadow-xl hover:scale-105 transition-transform"
            >
              <i data-lucide={chatOpen ? "x" : "message-square"} className="w-6 h-6"></i>
            </button>
          </div>
        </div>
      );
    }

    // --- HOME PANEL ---
    function HomePanel({ t, setCurrentPage }) {
      const stats = [
        { label: "Active Farmers Joined", value: "2,400+" },
        { label: "AI Leaf Diagnostics", value: "15,000+" },
        { label: "Local Trade Volume", value: "₹8.4 Lakhs" },
        { label: "Crop Suitability Match", value: "98.2%" }
      ];

      return (
        <div className="space-y-16">
          <header className="p-8 md:p-14 bg-gradient-to-r from-primary to-primary-light text-white rounded-3xl overflow-hidden shadow-xl flex flex-col md:flex-row items-center gap-10">
            <div className="flex-1 space-y-6">

    function DashboardPanel({ t, currentUser, setCurrentPage }) {
      const activeUserId = currentUser?.id || 1;
      const [summary, setSummary] = useState(null);
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [taskInput, setTaskInput] = useState('');
      const [taskDate, setTaskDate] = useState(() => new Date().toISOString().split('T')[0]);

      const fetchDashboard = async () => {
        try {
          setLoading(true);
          const res = await API.getDashboard(activeUserId);
          setSummary(res.data);
          setTasks(res.data.tasks || []);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchDashboard();
      }, [activeUserId]);

      const handleAddTask = async (e) => {
        e.preventDefault();
        if (!taskInput.trim()) return;
        try {
          const res = await API.createTask(activeUserId, taskInput, taskDate);
          setTasks(prev => [...prev, res.data]);
          setTaskInput('');
        } catch (err) {
          console.error(err);
        }
      };

      const handleToggleTask = async (taskId, current) => {
        try {
          const res = await API.updateTask(taskId, !current);
          setTasks(prev => prev.map(t => t.id === taskId ? res.data : t));
        } catch (err) {
          console.error(err);
        }
      };

      const handleDeleteTask = async (taskId) => {
        try {
          await API.deleteTask(taskId);
          setTasks(prev => prev.filter(t => t.id !== taskId));
        } catch (err) {
          console.error(err);
        }
      };

        return (

    // --- SEARCH PANEL ---
    function SearchPanel({ t, initialQuery }) {
      const [query, setQuery] = useState(initialQuery || '');
      const [results, setResults] = useState(null);
      const [isListening, setIsListening] = useState(false);
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        if (initialQuery) {
          setQuery(initialQuery);
          handleSearch(initialQuery);
        }
      }, [initialQuery]);

      const handleSearch = async (val) => {
        const q = val || query;
        if (!q.trim()) return;
        try {
          setLoading(true);
          const res = await API.globalSearch(q);
          setResults(res.data);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      const handleMic = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert(t('search_mic_error'));
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN';
        recognition.onstart = () => setIsListening(true);
        recognition.onresult = (e) => {
          const txt = e.results[0][0].transcript;
          setQuery(txt);
          handleSearch(txt);
        };
        recognition.onend = () => setIsListening(false);
        recognition.start();
      };

      return (
        <div className="max-w-4xl mx-auto space-y-8">
          <div className="text-center space-y-2">
            <h1 className="text-3xl font-extrabold text-primary">{t('search_title')}</h1>
            <p className="text-xs text-primary/60 max-w-sm mx-auto">Ask about seeds, fertilizers or farm schedules.</p>
          </div>

          <div className="relative max-w-xl mx-auto">
            <form onSubmit={e => { e.preventDefault(); handleSearch(); }} className="flex gap-2 p-1.5 bg-white border-2 border-primary/15 rounded-2xl shadow-sm focus-within:border-primary">
              <i data-lucide="search" className="w-5 h-5 text-primary/45 ml-2 mt-2"></i>
              <input 
                type="text" 
                value={query} 
                onChange={e => setQuery(e.target.value)} 
                placeholder={t('search_placeholder')}
                className="flex-1 px-2 py-2 text-xs bg-transparent border-none focus:outline-none"
              />
              <button 
                type="button" 
                onClick={handleMic} 
                className={`p-2 rounded-xl ${isListening ? 'bg-red-500 text-white' : 'bg-primary/5 text-primary'}`}
              >
                <i data-lucide="mic" className="w-4 h-4"></i>
              </button>
              <button type="submit" className="px-4 py-2 bg-primary text-white font-bold text-xs rounded-xl hover:bg-primary-light">
                Search
              </button>
            </form>
          </div>

          {loading ? (
            <div className="flex justify-center py-20"><div className="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div></div>
          ) : results ? (
            <div className="space-y-8">
              {results.crops?.length > 0 && (
                <div className="space-y-3">
                  <h3 className="font-bold text-sm text-primary-light uppercase tracking-wider flex items-center gap-1.5"><i data-lucide="sprout" className="w-4 h-4"></i> {t('search_results_crops')}</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {results.crops.map(c => (
                      <div key={c.id} className="p-4 bg-white border border-primary/10 rounded-2xl space-y-1">
                        <strong className="text-sm text-primary font-bold">{c.name}</strong>
                        <p className="text-xs text-primary/70">Season: <b>{c.season}</b> | Disease: <b>{c.disease}</b></p>
                        <span className="text-[10px] text-primary/50 block">Fertilizer advice: {c.fertilizer}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {results.marketplace?.length > 0 && (
                <div className="space-y-3">
                  <h3 className="font-bold text-sm text-primary-light uppercase tracking-wider flex items-center gap-1.5"><i data-lucide="shopping-bag" className="w-4 h-4"></i> {t('search_results_market')}</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {results.marketplace.map(m => (
                      <div key={m.id} className="p-4 bg-white border border-primary/10 rounded-2xl flex justify-between items-start">
                        <div>
                          <strong className="text-xs font-bold text-primary block">{m.name}</strong>
                          <span className="text-[10px] text-primary-light font-medium bg-primary/5 px-2 py-0.5 rounded-full inline-block mt-1">{m.category}</span>
                        </div>
                        <span className="text-xs font-black text-primary">₹{m.price}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {(!results.crops || results.crops.length === 0) && (!results.marketplace || results.marketplace.length === 0) && (
                <div className="text-center py-10 text-primary/45 font-bold">No results found. Try "Rice" or "Seeds".</div>
              )}
            </div>
          ) : null}
        </div>
      );
    }

    // --- LEAF SCANNER PANEL ---
    function ScannerPanel({ t }) {
      const [preview, setPreview] = useState('');
      const [diagnostics, setDiagnostics] = useState(null);
      const [loading, setLoading] = useState(false);

      const runDiagnosis = async (filename) => {
        try {
          setLoading(true);
          setDiagnostics(null);
          // Simulating file upload to FastAPI backend by creating a blob representing a mockup file
          const blob = new Blob(['mockup leaf file'], { type: 'image/jpeg' });
          const file = new File([blob], filename, { type: 'image/jpeg' });
          
          setPreview('https://images.unsplash.com/photo-1599599810769-bcde5a160d32?auto=format&fit=crop&w=300&q=80');
          const res = await API.uploadLeaf(file);
          setDiagnostics(res.data);
        } catch (err) {
          console.error(err);
          alert('Diagnosis service error. Verify the FastAPI server is running.');
        } finally {
          setLoading(false);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setPreview(URL.createObjectURL(file));
        runDiagnosis(file.name);
      };

      return (
        <div className="max-w-4xl mx-auto space-y-8">
          <div className="text-center space-y-2">
            <h1 className="text-3xl font-extrabold text-primary">{t('scanner_title')}</h1>
            <p className="text-xs text-primary/60 max-w-sm mx-auto">{t('scanner_subtitle')}</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <div className="space-y-6">
              <div 
                className="w-full h-52 border-2 border-dashed border-primary/20 bg-primary/5 rounded-2xl flex flex-col items-center justify-center p-4 cursor-pointer"
                onClick={() => document.getElementById('standalone-file').click()}
              >
                <input id="standalone-file" type="file" onChange={handleFileUpload} className="hidden" />
                {preview ? (
                  <img src={preview} alt="preview" className="h-full w-full object-contain" />
                ) : (
                  <div className="text-center space-y-2">
                    <i data-lucide="upload" className="w-8 h-8 mx-auto text-primary/45"></i>
                    <span className="text-xs font-bold text-primary block">{t('scanner_drop')}</span>
                  </div>
                )}
              </div>

              <div className="p-5 bg-white border border-primary/10 rounded-2xl">
                <span className="text-[10px] font-bold text-primary-light uppercase tracking-wider block mb-3">AI presets</span>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <button onClick={() => runDiagnosis('tomato_leaf_spot_early_blight.jpg')} className="p-2 border border-red-200 bg-red-50 text-red-700 rounded-lg text-left">🍅 Tomato (Blight)</button>
                  <button onClick={() => runDiagnosis('rice_paddy_fungus_blast.jpg')} className="p-2 border border-yellow-200 bg-yellow-50 text-yellow-700 rounded-lg text-left">🌾 Rice Blast</button>
                  <button onClick={() => runDiagnosis('coffee_rust.jpg')} className="p-2 border border-orange-200 bg-orange-50 text-orange-700 rounded-lg text-left">☕ Coffee Rust</button>
                  <button onClick={() => runDiagnosis('healthy_plant.jpg')} className="p-2 border border-green-200 bg-green-50 text-green-700 rounded-lg text-left">🌱 Healthy leaf</button>
                </div>
              </div>
            </div>

            <div>
              {loading ? (
                <div className="p-12 text-center border border-primary/10 rounded-2xl bg-white"><div className="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin mx-auto"></div><p className="text-xs font-bold text-primary/60 mt-3">Running cellular AI scanning...</p></div>
              ) : diagnostics ? (
                <div className="p-6 bg-white border border-primary/10 rounded-2xl space-y-4">
                  <h3 className="font-bold text-sm text-primary border-b border-primary/10 pb-2">{t('scanner_result')}</h3>
                  <div>
                    <span className="text-[10px] text-primary/50 font-bold block">DIAGNOSIS</span>
                    <strong className="text-lg font-black text-primary block">{diagnostics.disease}</strong>
                    <span className="text-xs font-bold text-primary-light block mt-1">Accuracy: {Math.round(diagnostics.confidence * 100)}%</span>
                  </div>
                  <p className="text-xs text-primary/80 leading-relaxed bg-primary/5 p-3.5 rounded-xl border border-primary/5">{diagnostics.description}</p>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div className="p-3 bg-green-50 border border-green-200 text-green-800 rounded-xl">
                      <span className="text-[10px] font-bold text-green-600 block">ORGANIC REMEDY</span>
                      <p className="mt-1 font-medium leading-relaxed">{diagnostics.organic_treatment}</p>
                    </div>
                    <div className="p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl">
                      <span className="text-[10px] font-bold text-amber-600 block">CHEMICAL PATHWAY</span>
                      <p className="mt-1 font-medium leading-relaxed">{diagnostics.remedy}</p>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="p-12 text-center text-primary/40 font-bold border border-dashed border-primary/15 rounded-2xl py-24">Diagnostics results will populate here.</div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- MARKETPLACE PANEL ---
    function MarketplacePanel({ t, currentUser }) {
      const [products, setProducts] = useState([]);
      const [cat, setCat] = useState('');
      const [loading, setLoading] = useState(true);
      const [formOpen, setFormOpen] = useState(false);

      // Form
      const [name, setName] = useState('');
      const [price, setPrice] = useState('');
      const [category, setCategory] = useState('Seeds');
      const [contact, setContact] = useState('');

      const fetchMarket = async (filterCat = '') => {
        try {
          setLoading(true);
          const res = await API.getMarketplace('', filterCat);
          setProducts(res.data);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchMarket(cat);
      }, [cat]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!name || !price) return;
        try {
          const res = await API.createProduct({
            product_name: name,
            category,
            price: parseFloat(price),
            seller: currentUser?.farmer_name || 'Independent Farmer',
            contact: contact || currentUser?.email || '+91 99999 88888',
            description: "Direct listing from farmer."
          });
          setProducts(prev => [res.data, ...prev]);
          setName('');
          setPrice('');
          setContact('');
          setFormOpen(false);
          alert(t('market_list_success'));
        } catch (err) {
          console.error(err);
        }
      };

      return (
        <div className="space-y-8">
          <div className="flex justify-between items-center">
            <div>
              <h1 className="text-3xl font-extrabold text-primary">{t('market_title')}</h1>
              <p className="text-xs text-primary/60 font-semibold mt-1">{t('market_subtitle')}</p>
            </div>
            <button onClick={() => setFormOpen(!formOpen)} className="px-4 py-2 bg-primary text-white font-bold text-xs rounded-xl shadow-sm hover:bg-primary-light">
              {formOpen ? "Close Panel" : t('market_sell_item')}
            </button>
          </div>

          {formOpen && (
            <form onSubmit={handleSubmit} className="p-6 bg-white border border-primary/10 rounded-2xl max-w-xl mx-auto space-y-4">
              <h3 className="font-bold text-sm text-primary">{t('market_sell_item')}</h3>
              <div className="grid grid-cols-2 gap-4 text-xs">
                <div>
                  <label className="font-bold">Product Name *</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" required />
                </div>
                <div>
                  <label className="font-bold">Category</label>
                  <select value={category} onChange={e => setCategory(e.target.value)} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl">
                    <option value="Seeds">{t('market_filter_seeds')}</option>
                    <option value="Fertilizers">{t('market_filter_fert')}</option>
                    <option value="Farming Tools">{t('market_filter_tools')}</option>
                    <option value="Crops">{t('market_filter_crops')}</option>
                  </select>
                </div>
                <div>
                  <label className="font-bold">Price (₹) *</label>
                  <input type="number" value={price} onChange={e => setPrice(e.target.value)} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" required />
                </div>
                <div>
                  <label className="font-bold">Contact Phone</label>
                  <input type="text" value={contact} onChange={e => setContact(e.target.value)} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" />
                </div>
              </div>
              <button type="submit" className="w-full py-2.5 bg-primary text-white font-bold text-xs rounded-xl">List Product</button>
            </form>
          )}

          <div className="flex gap-2 overflow-x-auto pb-1 text-xs font-bold">
            {[
              { val: '', label: t('market_filter_all') },
              { val: 'Seeds', label: t('market_filter_seeds') },
              { val: 'Fertilizers', label: t('market_filter_fert') },
              { val: 'Farming Tools', label: t('market_filter_tools') },
              { val: 'Crops', label: t('market_filter_crops') }
            ].map(c => (
              <button key={c.val} onClick={() => setCat(c.val)} className={`px-4 py-2 border rounded-xl shrink-0 ${cat === c.val ? 'bg-primary text-white border-primary' : 'bg-white text-primary border-primary/10'}`}>
                {c.label}
              </button>
            ))}
          </div>

          {loading ? (
            <div className="flex justify-center py-20"><div className="w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div></div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              {products.map(prod => (
                <ProductCard key={prod.id} product={prod} t={t} />
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- LEARNING PANEL ---
    function LearningPanel({ t }) {
      return (
        <div className="max-w-4xl mx-auto space-y-8">
          <div>
            <h1 className="text-3xl font-extrabold text-primary">AgriVerse Learning Center</h1>
            <p className="text-xs text-primary/60 font-semibold mt-1">Read tutorials and watch video courses on vermiculture and organic farming methods.</p>
          </div>

          <div className="space-y-6">
            <article className="p-6 bg-white border border-primary/10 rounded-2xl space-y-2">
              <span className="px-2.5 py-0.5 bg-green-100 text-green-800 text-[10px] font-bold rounded-md uppercase">Organic Composting</span>
              <h3 className="text-base font-extrabold text-primary">How to build a Vermicomposting Pit</h3>
              <p className="text-xs text-primary/70 leading-relaxed">
                Vermicomposting uses earthworms to break down organic wastes (vegetable scraps, dry leaves) into compost rich in nitrates and mineral blocks. Keep the bedding moist and cover the pit to preserve shade.
              </p>
            </article>

            <article className="p-6 bg-white border border-primary/10 rounded-2xl space-y-2">
              <span className="px-2.5 py-0.5 bg-blue-100 text-blue-800 text-[10px] font-bold rounded-md uppercase">Crop Rotation</span>
              <h3 className="text-base font-extrabold text-primary">Alternating Cereals with Legumes</h3>
              <p className="text-xs text-primary/70 leading-relaxed">
                Alternating heavy feeders (Rice, Maize) with nitrogen-fixing pulses (Groundnut, Tur Dal) increases soil fertility naturally, reducing dependence on chemical urea fertilizers.
              </p>
            </article>
          </div>
        </div>
      );
    }

    // --- CONTACT PANEL ---
    function ContactPanel({ t }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [message, setMessage] = useState('');
      const [sent, setSent] = useState(false);

      const handleSend = (e) => {
        e.preventDefault();
        setSent(true);
        setName('');
        setEmail('');
        setMessage('');
        setTimeout(() => setSent(false), 4000);
      };

      return (
        <div className="max-w-4xl mx-auto space-y-8">
          <div>
            <h1 className="text-3xl font-extrabold text-primary">{t('contact_title')}</h1>
            <p className="text-xs text-primary/60 mt-1">Connect with support hubs in Bangalore and Mumbai.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-8 items-stretch">
            <form onSubmit={handleSend} className="p-6 bg-white border border-primary/10 rounded-2xl space-y-4">
              <h3 className="font-bold text-sm text-primary">Email Support Desk</h3>
              {sent && <div className="p-3 bg-green-50 border border-green-200 text-green-700 text-xs font-bold rounded-lg">{t('contact_success')}</div>}
              <div className="space-y-3 text-xs">
                <div>
                  <label className="font-bold">{t('contact_name')}</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" required />
                </div>
                <div>
                  <label className="font-bold">{t('contact_email')}</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" required />
                </div>
                <div>
                  <label className="font-bold">{t('contact_msg')}</label>
                  <textarea value={message} onChange={e => setMessage(e.target.value)} rows={3} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" required></textarea>
                </div>
              </div>
              <button type="submit" className="w-full py-2.5 bg-primary text-white font-bold text-xs rounded-xl">{t('contact_send')}</button>
            </form>

            <div className="p-6 bg-white border border-primary/10 rounded-2xl space-y-4 text-xs">
              <h3 className="font-bold text-sm text-primary">Office Hubs</h3>
              <div className="space-y-3">
                <div>
                  <strong className="block font-bold">Bangalore Center (HQ)</strong>
                  <span>Krishi Bhawan, Hudson Circle, Bengaluru, KA - 560001</span>
                </div>
                <div>
                  <strong className="block font-bold">Mumbai Center</strong>
                  <span>Plot 12, APMC Market Yard, Vashi, Navi Mumbai, MH - 400703</span>
                </div>
                <div className="pt-3 border-t border-primary/10 font-bold">
                  <p>Helpline: +91 1800 123 4567 (Toll-Free)</p>
                  <p className="mt-1">Email: help@agriverse.com</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- LOGIN PANEL ---
    function LoginPanel({ t, onLoginSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isReg, setIsReg] = useState(false);
      const [name, setName] = useState('');
      const [loc, setLoc] = useState('Bangalore');

      const handleAuth = async (e) => {
        e.preventDefault();
        try {
          if (isReg) {
            const res = await API.register(name, email, loc, 'English', password);
            onLoginSuccess(res.data);
          } else {
            const res = await API.login(email, password);
            onLoginSuccess(res.data);
          }
        } catch (err) {
          console.error(err);
          alert('Auth failed. Verify database seeds and server are active.');
        }
      };

      return (
        <div className="max-w-md mx-auto py-10">
          <form onSubmit={handleAuth} className="p-8 bg-white border border-primary/10 rounded-3xl shadow-lg space-y-4">
            <h2 className="text-xl font-bold text-primary text-center">{isReg ? "Create Farmer Profile" : t('btn_login')}</h2>
            <div className="space-y-3 text-xs">
              {isReg && (
                <div>
                  <label className="font-bold">Farmer Name</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" required />
                </div>
              )}
              <div>
                <label className="font-bold">Email Address</label>
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" required />
              </div>
              {isReg && (
                <div>
                  <label className="font-bold">Location (City/Place in India)</label>
                  <input 
                    type="text" 
                    value={loc} 
                    onChange={e => setLoc(e.target.value)} 
                    placeholder="e.g. Punjab, Delhi, Coimbatore, Shimla..." 
                    className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" 
                    required 
                  />
                </div>
              )}
              <div>
                <label className="font-bold">Password</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full mt-1 p-2 bg-background border border-primary/10 rounded-xl" required />
              </div>
            </div>
            <button type="submit" className="w-full py-2.5 bg-primary text-white font-bold text-xs rounded-xl shadow-sm">{isReg ? "Register" : "Log In"}</button>
            <div className="text-center pt-2 text-[11px] font-bold">
              <button type="button" onClick={() => setIsReg(!isReg)} className="text-primary-light hover:underline">
                {isReg ? "Switch to Sign In" : "Register new Farmer profile"}
              </button>
            </div>
          </form>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
